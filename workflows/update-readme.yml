name: README Projelerini Güncelle

on:
  schedule:
    - cron: "0 3 * * *"      # her gün 03:00 UTC (TR saatiyle 06:00)
  workflow_dispatch:          # Actions sekmesinden elle de çalıştırabilirsin
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: README'yi güncelle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/update-projects.js

      - name: Değişiklikleri commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: README proje listesi güncellendi"
          git push